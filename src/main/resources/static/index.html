<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Speech to Text</title>

    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>

    <main class="container">

        <h1>Speech to Text</h1>

        <p class="instructions">
            Press Start Recording, speak into your microphone,
            then press Stop Recording when you are finished.
        </p>

        <div id="status" class="status">
            Ready to record
        </div>

        <div class="controls">

            <button id="startButton" type="button">
                Start Recording
            </button>

            <button id="stopButton" type="button" disabled>
                Stop Recording
            </button>

        </div>

        <section id="recordingSection" class="recording-section" hidden>

            <h2>Recorded Audio</h2>

            <audio id="audioPlayback" controls></audio>

        </section>

        <section id="transcriptionSection" hidden>

            <h2>Server Response</h2>

            <p id="transcriptionText"></p>

        </section>

        <p id="errorMessage" class="error-message"></p>

    </main>

    <script src="/js/app.js"></script>

</body>

</html>
